$schema: "https://json-schema.org/draft/2020-12/schema"
title: Lifecycle Receipt
type: object
required:
  - task_id
  - lifecycle_mode
  - input_refs
  - output_refs
  - changed_files
  - checks_run
  - risks_detected
  - next_recommended_mode
  - stop_reason
  - secrets_touched
  - production_behavior_changed
  - external_messages_sent
  - services_restarted
properties:
  task_id:
    type: string
    minLength: 1
  lifecycle_mode:
    $ref: "#/$defs/lifecycle_mode"
  input_refs:
    type: array
    items:
      type: string
  output_refs:
    type: array
    items:
      type: string
  changed_files:
    type: array
    items:
      type: string
  checks_run:
    type: array
    items:
      type: string
  risks_detected:
    type: array
    items:
      type: string
  next_recommended_mode:
    $ref: "#/$defs/lifecycle_mode"
  stop_reason:
    type: string
    enum:
      - completed
      - blocked
      - failed
      - needs_approval
      - handed_off
  secrets_touched:
    type: boolean
  production_behavior_changed:
    type: boolean
  external_messages_sent:
    type: boolean
  services_restarted:
    type: boolean
  outcome_status:
    type: string
    enum:
      - SUCCESS
      - FAILED
      - BLOCKED
      - AWAITING_APPROVAL
      - PARTIAL
  execution_state:
    type: string
    enum:
      - completed
      - failed
      - blocked
      - awaiting_approval
      - partial
      - timed_out
      - interrupted
  acceptance_criteria:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - criterion_id
        - required_evidence
      properties:
        criterion_id:
          type: string
          minLength: 1
        required_evidence:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
      additionalProperties: false
  satisfied_criterion_ids:
    type: array
    items:
      type: string
      minLength: 1
  verified_evidence_refs:
    type: array
    items:
      type: string
      minLength: 1
  missing_evidence_refs:
    type: array
    items:
      type: string
      minLength: 1
  outcome_reason:
    type: string
    enum:
      - ACCEPTANCE_VERIFIED
      - ACCEPTANCE_EVIDENCE_MISSING
      - EXECUTION_FAILED
      - EXECUTION_BLOCKED
      - APPROVAL_PENDING
      - EXECUTION_PARTIAL
additionalProperties: true
$defs:
  lifecycle_mode:
    type: string
    enum:
      - prototyper
      - builder
      - sweeper
      - grower
      - maintainer
