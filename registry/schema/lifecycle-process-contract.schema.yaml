$schema: https://json-schema.org/draft/2020-12/schema
title: Process Contract
type: object
required:
  - schema_version
  - type
  - id
  - version
  - owner
  - purpose
  - entry_condition
  - terminal_outcomes
  - stages
  - handoffs
  - metrics
  - forbidden_shortcuts
properties:
  schema_version:
    type: string
    const: '1.0'
  type:
    type: string
    const: process_contract
  id:
    type: string
    minLength: 1
  version:
    type: string
    minLength: 1
  owner:
    type: string
    minLength: 1
  purpose:
    type: string
    minLength: 1
  entry_condition:
    type: string
    minLength: 1
  terminal_outcomes:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: '#/$defs/non_empty_string'
  stages:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - purpose
        - required_evidence
        - outputs
        - next_stages
      properties:
        id:
          $ref: '#/$defs/non_empty_string'
        name:
          $ref: '#/$defs/non_empty_string'
        purpose:
          $ref: '#/$defs/non_empty_string'
        required_evidence:
          type: array
          items:
            $ref: '#/$defs/non_empty_string'
        outputs:
          type: array
          items:
            $ref: '#/$defs/non_empty_string'
        next_stages:
          type: array
          items:
            $ref: '#/$defs/non_empty_string'
  handoffs:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: '#/$defs/non_empty_string'
  metrics:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: '#/$defs/non_empty_string'
  forbidden_shortcuts:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: '#/$defs/non_empty_string'
additionalProperties: false
$defs:
  non_empty_string:
    type: string
    minLength: 1
