[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hlinor-registry"
dynamic = ["version"]
description = "Governance and security layer for auditable AI agent systems."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "HlinorAI Team", email = "team@hlinor.ai"}
]
maintainers = [
    {name = "HlinorAI Team", email = "team@hlinor.ai"}
]
keywords = [
    "ai",
    "agents",
    "governance",
    "security",
    "policy",
    "compliance",
    "audit",
    "langchain",
    "multi-agent",
    "registry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "cryptography>=43.0.0",
    "PyYAML>=6.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "types-PyYAML>=6.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "yamllint>=1.32.0",
    "pre-commit>=3.4.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]
all = [
    "langchain-core>=1.4,<2.0",
    "crewai>=1.15,<2.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "types-PyYAML>=6.0",
]
crewai = [
    "crewai>=1.15,<2.0",
]

[tool.mypy]
python_version = "3.10"

# Optional and third-party dependencies without bundled type information.
[[tool.mypy.overrides]]
module = [
    "yaml",
    "pydantic",
    "crewai",
    "crewai.*",
    "langchain_core",
    "langchain_core.*",
]
ignore_missing_imports = true

[project.urls]
Homepage = "https://github.com/HlinorAI/hlinor-agent-registry"
Documentation = "https://github.com/HlinorAI/hlinor-agent-registry#readme"
Repository = "https://github.com/HlinorAI/hlinor-agent-registry"
Issues = "https://github.com/HlinorAI/hlinor-agent-registry/issues"
Changelog = "https://github.com/HlinorAI/hlinor-agent-registry/blob/main/CHANGELOG.md"

[project.scripts]
hlinor-registry = "hlinor_registry.cli:main"

[tool.setuptools]
packages = ["hlinor_registry", "hlinor_registry.integrations"]

[tool.setuptools.dynamic]
version = {attr = "hlinor_registry._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["hlinor_registry"]

[tool.coverage.report]
fail_under = 70
show_missing = true
