name: Publish Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable vX.Y.Z tag to publish or recover
        required: true
        type: string

env:
  RELEASE_REF: ${{ inputs.release_tag || github.ref }}
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate-trigger:
    name: Validate the release trigger
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require manual recovery from main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

  # Everything the push and pull-request pipeline runs, against the tagged
  # commit, before anything is built for PyPI. A PyPI version is immutable:
  # publishing first and discovering a failure afterwards leaves nothing to
  # undo.
  verify-source:
    name: Verify the tagged commit
    needs: validate-trigger
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.release_tag || github.ref }}

  build:
    name: Build and attest release artifacts
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          namespace = {}
          exec(Path("hlinor_registry/_version.py").read_text(), namespace)
          version = namespace["__version__"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match package version {version}")
          PY

      - name: Verify checkout is the immutable tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = \
            "$(git rev-parse "${RELEASE_TAG}^{commit}")"

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Test the release wheel in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          release_venv="${RUNNER_TEMP}/hlinor-release-wheel"
          version="${RELEASE_TAG#v}"

          python -m venv "$release_venv"
          "$release_venv/bin/python" -m pip install --upgrade pip
          "$release_venv/bin/python" -m pip install dist/*.whl
          "$release_venv/bin/python" -m pip check
          "$release_venv/bin/hlinor-registry" --version |
            grep -Fx "hlinor-registry $version"
          "$release_venv/bin/hlinor-registry" --help | grep -q "verify-bundle"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          sha256sum dist/* > release-metadata/SHA256SUMS
          cat release-metadata/SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"

      - name: Upload release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksum manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distribution-hashes
          path: release-metadata/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish attested artifacts to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Download checksum manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distribution-hashes
          path: release-metadata

      - name: Verify downloaded artifacts
        run: sha256sum --check release-metadata/SHA256SUMS

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist
          attestations: true

  verify:
    name: Verify PyPI artifacts and installation
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Download checksum manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distribution-hashes
          path: release-metadata

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify PyPI SHA-256 digests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check release-metadata/SHA256SUMS
          version="${RELEASE_TAG#v}"

          for attempt in {1..12}; do
            set +e
            VERSION="$version" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import urllib.error
          import urllib.request

          version = os.environ["VERSION"]
          local = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in Path("dist").iterdir()
              if path.is_file()
          }

          try:
              with urllib.request.urlopen(
                  f"https://pypi.org/pypi/hlinor-registry/{version}/json",
                  timeout=15,
              ) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  raise SystemExit(75)
              raise

          published = {
              item["filename"]: item["digests"]["sha256"]
              for item in payload["urls"]
          }
          if local.keys() != published.keys():
              raise SystemExit(75)

          mismatches = {
              name: (local[name], published[name])
              for name in local
              if local[name] != published[name]
          }
          if mismatches:
              print(f"PyPI SHA-256 mismatch: {mismatches}", file=sys.stderr)
              raise SystemExit(1)

          for name, digest in sorted(local.items()):
              print(f"Verified PyPI artifact: {name} sha256={digest}")
          PY
            status=$?
            set -e

            if [[ "$status" -eq 0 ]]; then
              break
            fi
            if [[ "$status" -ne 75 ]]; then
              exit "$status"
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "PyPI did not expose the complete release after 12 attempts." >&2
              exit 1
            fi

            echo "Waiting for complete PyPI release metadata (attempt $attempt/12)."
            sleep 10
          done

      - name: Install and verify published package
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          smoke_venv="${RUNNER_TEMP}/hlinor-pypi-smoke"

          python -m venv "$smoke_venv"
          "$smoke_venv/bin/python" -m pip install --upgrade pip

          for attempt in {1..12}; do
            if "$smoke_venv/bin/python" -m pip install \
              --no-cache-dir \
              --index-url https://pypi.org/simple \
              --retries 1 \
              --timeout 15 \
              "hlinor-registry==$version"; then
              break
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo "Published package was not available after 12 attempts." >&2
              exit 1
            fi

            echo "PyPI has not indexed version $version yet; retrying in 10 seconds."
            sleep 10
          done

          "$smoke_venv/bin/python" -m pip check
          "$smoke_venv/bin/hlinor-registry" --version
          "$smoke_venv/bin/hlinor-registry" --help | grep -q "verify-bundle"
          "$smoke_venv/bin/python" - "$version" <<'PY'
          import importlib.metadata
          import sys

          import hlinor_registry

          expected = sys.argv[1]
          installed = importlib.metadata.version("hlinor-registry")
          if installed != expected or hlinor_registry.__version__ != expected:
              raise SystemExit(
                  f"Version mismatch: expected={expected}, "
                  f"metadata={installed}, import={hlinor_registry.__version__}"
              )
          PY

  github-release:
    name: Publish the GitHub release
    # Runs only after the package is on PyPI and verified from there, and in a
    # separate job so that a failure here can never affect publishing. Through
    # 0.8.0 this step was done by hand, and 0.8.0 shipped to PyPI while the
    # releases page still showed 0.7.0 as latest -- a gap nobody notices until
    # someone reads the repository to find out what the current version is.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Download checksum manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distribution-hashes
          path: release-metadata

      - name: Extract this version's changelog section
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          notes="${RUNNER_TEMP}/release-notes.md"

          # Take everything between this version's heading and the next one.
          # An empty section means the changelog was not updated, which is
          # worth failing on: release notes assembled from nothing are worse
          # than none, because they read as though there was nothing to say.
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "$notes"

          if [ ! -s "$notes" ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

          {
            echo
            echo "---"
            echo
            echo '```bash'
            echo "pip install --upgrade hlinor-registry"
            echo '```'
          } >> "$notes"

          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists and is immutable." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            dist/* \
            release-metadata/SHA256SUMS \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "${{ steps.notes.outputs.path }}" \
            --latest
