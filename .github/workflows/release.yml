name: Publish Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          namespace = {}
          exec(Path("hlinor_registry/_version.py").read_text(), namespace)
          version = namespace["__version__"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match package version {version}")
          PY

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A tag can be pushed more than once: a history rewrite moves it, and
          # the workflow runs again. PyPI refuses to replace an existing
          # version, which is correct, but failing the job for it turns a
          # no-op into a red run and hides real failures. Treat an already
          # published version as success; the verify job below still checks
          # that what is on PyPI matches the tag.
          skip-existing: true

  verify:
    name: Verify published package from PyPI
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install and verify published package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          smoke_venv="${RUNNER_TEMP}/hlinor-pypi-smoke"

          python -m venv "$smoke_venv"
          "$smoke_venv/bin/python" -m pip install --upgrade pip

          for attempt in {1..12}; do
            if "$smoke_venv/bin/python" -m pip install \
              --no-cache-dir \
              --index-url https://pypi.org/simple \
              --retries 1 \
              --timeout 15 \
              "hlinor-registry==$version"; then
              break
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo "Published package was not available after 12 attempts." >&2
              exit 1
            fi

            echo "PyPI has not indexed version $version yet; retrying in 10 seconds."
            sleep 10
          done

          "$smoke_venv/bin/python" -m pip check
          "$smoke_venv/bin/hlinor-registry" --version
          "$smoke_venv/bin/hlinor-registry" --help | grep -q "verify-bundle"
          "$smoke_venv/bin/python" - "$version" <<'PY'
          import importlib.metadata
          import sys

          import hlinor_registry

          expected = sys.argv[1]
          installed = importlib.metadata.version("hlinor-registry")
          if installed != expected or hlinor_registry.__version__ != expected:
              raise SystemExit(
                  f"Version mismatch: expected={expected}, "
                  f"metadata={installed}, import={hlinor_registry.__version__}"
              )
          PY
