name: Tests & Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable so the release workflow can require these exact jobs before it
  # publishes. A tag push does not match a branch filter, so before this the
  # release ran no tests at all -- the ones that gave anyone confidence had
  # run earlier, against a branch, in a workflow the release did not consult.
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out in every verification job
        required: false
        type: string

jobs:
  # This repository is a public specification. Internal tooling and operational
  # data reached its history once already, and the cleanup was expensive
  # because a published commit cannot be recalled. These checks are cheap.
  public-scope:
    name: Scope and secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          # gitleaks needs history, not just the tip, to catch a secret that
          # was committed and then removed in a later commit of the same PR.
          fetch-depth: 0

      # gitleaks itself is MIT licensed and free. Only the gitleaks-action
      # wrapper requires a paid GITLEAKS_LICENSE for organization accounts, so
      # run the binary directly and keep the check unconditional.
      #
      # The checksum is verified against the checksums file published with the
      # same release. That protects against a corrupted or truncated download,
      # not against a compromised release: both come from one source. Pinning
      # the version is what limits the blast radius.
      - name: Scan history for secrets
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          curl -sSfL "${base}/${archive}" -o "$archive"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " ${archive}\$" checksums.txt | sha256sum -c -

          tar -xzf "$archive" gitleaks
          ./gitleaks version

          # --redact keeps any finding out of the public log; the exit code is
          # what fails the job.
          ./gitleaks git . --redact --verbose

      - name: Enforce the public-scope rule on tracked files
        run: |
          set -euo pipefail
          git ls-files -z | xargs -0 python3 scripts/check_public_scope.py

      # Runs here rather than in its own job on purpose: a new job would need a
      # new required context, which is the very thing this check exists to stop
      # anyone from forgetting.
      - name: Check the required-checks list against this workflow
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'pyyaml==6.0.2'
          python3 scripts/check_required_checks.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Run adversarial conformance suite
        run: python -m pytest tests/test_adversarial_conformance.py -q

      - name: Run MCP tools/call conformance suite
        run: python -m pytest tests/test_mcp_conformance.py -q

      - name: Enforce coverage baseline
        if: matrix.python-version == '3.11'
        run: python -m pytest tests/ --cov=hlinor_registry --cov-report=term-missing

      - name: Run static checks
        run: make lint

      - name: Enforce PolicyChecker performance guardrails
        if: matrix.python-version == '3.11'
        run: |
          python -m benchmarks.policy_checker_benchmark \
            --quick \
            --enforce-budget \
            --format json

      - name: Smoke test CLI validation
        run: |
          hlinor-registry validate-agent examples/secure_financial_agent.yaml
          hlinor-registry validate-agent examples/budget_limited_research_agent.yaml
          hlinor-registry validate-tool-contract \
            examples/tool-contracts/customer-support-tools.yaml

      - name: Smoke test contract drift detection
        run: |
          set -euo pipefail
          hlinor-registry contract check \
            --agent examples/tool-contracts/customer-support-agent.yaml \
            --tools examples/tool-contracts/customer-support-tools.yaml
          hlinor-registry contract diff \
            --expected examples/tool-contracts/customer-support-tools.yaml \
            --observed examples/tool-contracts/customer-support-tools.yaml

      - name: Enforce governance coverage inventory
        run: |
          set -euo pipefail
          hlinor-registry validate-governance-coverage \
            examples/governance-coverage/coverage.yaml
          hlinor-registry coverage check \
            --manifest examples/governance-coverage/coverage.yaml \
            --format json

      - name: Smoke test custom Python Tool Contract export
        run: |
          cd "${RUNNER_TEMP}"
          python "${GITHUB_WORKSPACE}/examples/custom_tool_export.py"
          hlinor-registry validate-tool-contract dist/custom-tools.yaml

      # The documented quickstart is compile -> check -> explain. Validation
      # alone passed while that path was broken on a fresh clone, so exercise
      # the whole path against the repository's own manifest.
      - name: Smoke test the documented quickstart path
        run: |
          set -euo pipefail
          hlinor-registry compile \
            --manifest registry.yaml \
            --output "${RUNNER_TEMP}/policy-bundle.json"
          hlinor-registry check \
            --bundle "${RUNNER_TEMP}/policy-bundle.json" \
            --agent financial-audit-agent \
            --action read
          hlinor-registry explain \
            --bundle "${RUNNER_TEMP}/policy-bundle.json" \
            --agent financial-audit-agent \
            --action read

      - name: Smoke test fail-closed exit codes
        run: |
          set -euo pipefail
          hlinor-registry compile \
            --manifest registry.yaml \
            --output "${RUNNER_TEMP}/policy-bundle.json"

          # A blocked action must exit 1, not 0 and not the error code.
          set +e
          hlinor-registry check \
            --bundle "${RUNNER_TEMP}/policy-bundle.json" \
            --agent financial-audit-agent \
            --action initiate_transfer
          denied_status=$?

          # A missing bundle is an environment failure, not a policy denial.
          hlinor-registry check \
            --bundle "${RUNNER_TEMP}/does-not-exist.json" \
            --agent financial-audit-agent \
            --action read
          error_status=$?
          set -e

          test "$denied_status" -eq 1 || {
            echo "Expected exit 1 for a denied action, got $denied_status" >&2
            exit 1
          }
          test "$error_status" -eq 2 || {
            echo "Expected exit 2 for a missing bundle, got $error_status" >&2
            exit 1
          }

      # Unit tests cover the policy handlers. This covers the path a user
      # actually takes: author YAML, compile, ask the CLI. Every release that
      # broke so far broke somewhere along that path while unit tests stayed
      # green.
      - name: Smoke test typed policy enforcement
        run: |
          set -euo pipefail
          hlinor-registry compile \
            --manifest registry.yaml \
            --output "${RUNNER_TEMP}/typed-bundle.json"

          expect() {
            local want="$1"; shift
            local out status
            set +e
            out=$("$@" 2>&1)
            status=$?
            set -e
            if [ "$status" -ne "$want" ]; then
              echo "Expected exit $want, got $status for: $*" >&2
              echo "$out" >&2
              exit 1
            fi
            printf '%s\n' "$out"
          }

          approval() {
            cat > "${RUNNER_TEMP}/approval.json" <<JSON
          {"approval": {"approver_role": "support-lead",
                        "granted_for": "$1",
                        "granted_at": "$2"}}
          JSON
          }

          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          future=$(date -u -d '+1 year' +%Y-%m-%dT%H:%M:%SZ)

          # No approval attached: denied by the policy, not by the action list.
          out=$(expect 1 hlinor-registry check \
            --bundle "${RUNNER_TEMP}/typed-bundle.json" \
            --agent refund-agent --action refund_payment --resource ticket/1234)
          grep -q "POLICY_SIGNAL_MISSING" <<<"$out"
          grep -q "refund-requires-approval" <<<"$out"

          # A correctly bound, current approval is allowed.
          approval "refund_payment:ticket/1234" "$now"
          expect 0 hlinor-registry check \
            --bundle "${RUNNER_TEMP}/typed-bundle.json" \
            --agent refund-agent --action refund_payment --resource ticket/1234 \
            --signals-file "${RUNNER_TEMP}/approval.json" > /dev/null

          # A future-dated approval must not satisfy freshness.
          approval "refund_payment:ticket/1234" "$future"
          out=$(expect 1 hlinor-registry check \
            --bundle "${RUNNER_TEMP}/typed-bundle.json" \
            --agent refund-agent --action refund_payment --resource ticket/1234 \
            --signals-file "${RUNNER_TEMP}/approval.json")
          grep -q "APPROVAL_REQUIRED" <<<"$out"
          grep -q "future" <<<"$out"

          # An approval for another ticket must not be replayable onto this one.
          approval "refund_payment:ticket/9999" "$now"
          out=$(expect 1 hlinor-registry check \
            --bundle "${RUNNER_TEMP}/typed-bundle.json" \
            --agent refund-agent --action refund_payment --resource ticket/1234 \
            --signals-file "${RUNNER_TEMP}/approval.json")
          grep -q "APPROVAL_REQUIRED" <<<"$out"

          # The audit event must name the matched pattern and the policy.
          approval "refund_payment:ticket/1234" "$now"
          event=$(hlinor-registry check \
            --bundle "${RUNNER_TEMP}/typed-bundle.json" \
            --agent refund-agent --action refund_payment --resource ticket/1234 \
            --signals-file "${RUNNER_TEMP}/approval.json" --format jsonl)
          python -c "
          import json, sys
          event = json.loads(sys.argv[1])
          assert event['matched_pattern'] == 'refund_payment:ticket/*', event
          assert event['matched_policy_ids'] == ['refund-requires-approval'], event
          assert event['result'] == 'allowed', event
          " "$event"

      - name: Run deterministic policy examples
        run: |
          set -euo pipefail
          hlinor-registry compile \
            --manifest registry.yaml \
            --output "${RUNNER_TEMP}/policy-test-bundle.json"
          hlinor-registry test-policies \
            --bundle "${RUNNER_TEMP}/policy-test-bundle.json" \
            --tests examples/policy-tests/refund-policy-tests.yaml
          hlinor-registry test-policies \
            --bundle "${RUNNER_TEMP}/policy-test-bundle.json" \
            --tests examples/policy-tests/refund-policy-tests.yaml \
            --format json > "${RUNNER_TEMP}/policy-test-report.json"
          python -c "
          import json, pathlib
          report = json.loads(
              pathlib.Path('${RUNNER_TEMP}/policy-test-report.json').read_text()
          )
          assert report['status'] == 'passed', report
          assert report['summary'] == {'failed': 0, 'passed': 4, 'total': 4}, report
          "

      - name: Smoke test signed bundle verification
        run: |
          set -euo pipefail
          openssl genpkey -algorithm ED25519 -out "${RUNNER_TEMP}/signing-key.pem"
          openssl pkey \
            -in "${RUNNER_TEMP}/signing-key.pem" \
            -pubout \
            -out "${RUNNER_TEMP}/signing-key.pub.pem"
          hlinor-registry compile \
            --manifest registry.yaml \
            --output "${RUNNER_TEMP}/signed-bundle.json" \
            --signing-key "${RUNNER_TEMP}/signing-key.pem" \
            --key-id ci-smoke-key \
            --issuer hlinor-ci-smoke \
            --issued-at "$(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ)" \
            --expires-at "$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)"
          cat > "${RUNNER_TEMP}/trust-store.json" <<TRUST
          {
            "schema_version": "1.0",
            "keys": {
              "ci-smoke-key": {
                "algorithm": "Ed25519",
                "public_key_path": "${RUNNER_TEMP}/signing-key.pub.pem",
                "issuer": "hlinor-ci-smoke"
              }
            }
          }
          TRUST
          hlinor-registry verify-bundle \
            --bundle "${RUNNER_TEMP}/signed-bundle.json" \
            --trust-store "${RUNNER_TEMP}/trust-store.json" \
            --signature-policy required \
            --required-issuer hlinor-ci-smoke

  crewai-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install CrewAI integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,crewai]" \
            "crewai==1.15.6" \
            "pydantic==2.12.5"

      - name: Run CrewAI integration tests
        run: python -m pytest tests/test_crewai_integration.py -v

      - name: Smoke test CrewAI Tool Contract export
        run: |
          cd "${RUNNER_TEMP}"
          python "${GITHUB_WORKSPACE}/examples/crewai_tool_export.py"
          hlinor-registry validate-tool-contract dist/crewai-tools.yaml

  langchain-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      # The [langchain] extra is asserted here as well as installed: pip only
      # warns about an undeclared extra, so a missing one stayed invisible in CI
      # while `pip install "hlinor-registry[langchain]"` silently installed
      # nothing for users following the README.
      - name: Install LangChain integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,langchain]" \
            "langchain-core==1.4.9" \
            "pydantic==2.13.4"
          python - <<'PY'
          from importlib.metadata import metadata

          extras = set(metadata("hlinor-registry").get_all("Provides-Extra") or [])
          missing = {"autogen", "langchain", "crewai", "dev"} - extras
          if missing:
              raise SystemExit(f"pyproject is missing declared extras: {sorted(missing)}")
          PY

      - name: Run LangChain integration tests
        run: python -m pytest tests/test_langchain_integration.py -v

      - name: Smoke test LangChain Tool Contract export
        run: |
          cd "${RUNNER_TEMP}"
          python "${GITHUB_WORKSPACE}/examples/langchain_tool_export.py"
          hlinor-registry validate-tool-contract dist/langchain-tools.yaml

  autogen-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install AutoGen integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,autogen]" \
            "autogen-core==0.7.5"

      - name: Run AutoGen integration tests
        run: python -m pytest tests/test_autogen_integration.py -v

      - name: Smoke test AutoGen Tool Contract export
        run: |
          cd "${RUNNER_TEMP}"
          python "${GITHUB_WORKSPACE}/examples/autogen_tool_export.py"
          hlinor-registry validate-tool-contract dist/autogen-tools.yaml

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import glob
          import tarfile

          [sdist] = glob.glob("dist/*.tar.gz")
          with tarfile.open(sdist, "r:gz") as archive:
              names = archive.getnames()
          expected_suffixes = (
              "tests/fixtures/tool-contracts/stable-v1.0.yaml",
              "benchmarks/fixtures/registry.yaml",
              "benchmarks/policy_checker_benchmark.py",
          )
          for expected_suffix in expected_suffixes:
              assert any(name.endswith(expected_suffix) for name in names), names
          PY

      - name: Verify wheel in a clean environment
        run: |
          python -m venv /tmp/hlinor-wheel-test
          /tmp/hlinor-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/hlinor-wheel-test/bin/hlinor-registry --version
          /tmp/hlinor-wheel-test/bin/python -c \
            "from importlib.metadata import version; import hlinor_registry; "\
            "assert hlinor_registry.__version__ == version('hlinor-registry')"
